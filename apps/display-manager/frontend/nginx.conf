# Control panel web server (production). Serves the built panel and forwards
# /api to the backend, which is not exposed on the network itself.
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Never pass a display key through from a browser.
        proxy_set_header X-Display-Key "";
        client_max_body_size 200m;   # photo and GIF uploads
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
