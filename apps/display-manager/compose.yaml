# Display manager: production stack.
#
# Deploy:   ./scripts/deploy.sh display-manager   (from the repo root)
# Settings: .env next to this file (copy .env.example and fill it in)
#
# Exposure: only the control panel is published on the network (port 3000).
# The kiosk display is published on 127.0.0.1 for the Pi's own browser, and
# the backend isn't published at all: both web servers reach it internally.
# The Bluetooth bridge isn't published either; only the backend calls it.
# The backend publishes one UDP port, 4002, for Govee lights' status replies.

name: display-manager

services:
  backend:
    build: ./backend
    container_name: display-manager-backend
    hostname: ${PI_HOSTNAME:-raspberrypi}   # shown in System Information
    env_file: .env
    environment:
      APP_ENV: prod
      DOCKER_HOST: tcp://docker-proxy:2375  # read-only Docker API, see docker-proxy
      DRIVES: "NVMe SSD=/drives/system;Hard Drive=/drives/data"
    devices:
      - /dev/spidev0.0:/dev/spidev0.0       # WS2812 LED (SPI0)
    ports:
      # Govee lights send status replies to this port on the Pi (see
      # backend/app/govee.py). The backend ignores anything that isn't
      # from a configured light; the firewall limits it to the home network.
      - "4002:4002/udp"
    volumes:
      - /sys:/sys                           # fan PWM (/sys/class/pwm)
      - ./data:/app/data                    # saved settings, login, photo cache, power requests
      - ./media/uploads:/app/media          # Media Library
      - ./media/clock-photos:/app/clock-photos
      # Drive usage: one folder on each drive, read-only. If the data drive
      # isn't mounted, Docker recreates its folder on the system drive and
      # the panel shows "Not mounted".
      - ./data:/drives/system:ro
      - ${DATA_DISK:?set DATA_DISK in .env}/.pi5-homelab:/drives/data:ro
    restart: unless-stopped

  # Bluetooth LED strip. Talks to the host's BlueZ over D-Bus as an
  # unprivileged user (BlueZ's policy lets any user use Bluetooth, and the
  # rest of the system bus is closed to it). Reached only by the backend.
  ble-bridge:
    build: ./ble-bridge
    container_name: display-manager-ble-bridge
    environment:
      LED_STRIP_ADDRESS: ${LED_STRIP_ADDRESS:-}
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Lets the backend list containers without giving it the Docker socket.
  # Only GET requests to /containers are allowed (POST is off by default).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: display-manager-docker-proxy
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  display:
    build: ./display
    container_name: display-manager-display
    environment:
      DISPLAY_KEY: ${DISPLAY_KEY:?set DISPLAY_KEY in .env}
    ports:
      - "127.0.0.1:5174:5174"               # the kiosk browser on the Pi only
    depends_on: [backend]
    restart: unless-stopped

  panel:
    build: ./frontend
    container_name: display-manager-panel
    ports:
      - "${PANEL_PORT:-3000}:3000"          # LAN + Tailscale (the firewall blocks the rest)
    depends_on: [backend]
    restart: unless-stopped
